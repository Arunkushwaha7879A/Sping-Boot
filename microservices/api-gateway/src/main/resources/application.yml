server:
  port: 9095

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoint:
    gateway:
      access: read_only
  endpoints:
    web:
      exposure:
        include: "*"


resilience4j:
  circuitbreaker:
    configs:
      defaults:
        sliding-window-size: 10
        permitted-number-of-calls-in-half-open-state: 2
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10000

  cloud:
    gateway:
      httpclient:
        connect-timeout: 1000
        response-timeout: 5s

  data:
    redis:
      host: localhost
      port: 6379
      username: guest
      password: guest


